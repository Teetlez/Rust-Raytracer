[package]
name = "rust_raytracer"
version = "0.1.8"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mimalloc = { version = "0.1", default-features = false }
ultraviolet = { version = "0.10", features = ["bytemuck"] }
minifb = "0.28"
fastrand = "2.3"
quasirandom = "0.3"
rayon = "1.10"
radiant = "0.3"
clap = { version = "4.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.10"
png = "0.17"
tobj = "4.0.3"
wgpu = "25.0"
winit = "0.30.0"
anyhow = "1.0"
bytemuck = { version = "1.23", features = ["derive"] }
pollster = { version = "0.4", features = ["macro"] }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
debug = true
